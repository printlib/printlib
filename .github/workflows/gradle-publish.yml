# This workflow builds tagged releases and verifies the public JitPack artifact
# used by downstream consumers such as the tray application.

name: Gradle Release Verify

on:
  push:
    tags:
      - 'v*'

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'adopt'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle
      run: ./gradlew build

    - name: Resolve release version
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Verify public JitPack artifact
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail

        POM_URL="https://jitpack.io/com/github/printlib/printlib/${VERSION}/printlib-${VERSION}.pom"
        JAR_URL="https://jitpack.io/com/github/printlib/printlib/${VERSION}/printlib-${VERSION}.jar"

        echo "Checking public POM: ${POM_URL}"
        curl --fail --silent --show-error --location "${POM_URL}" -o /tmp/printlib.pom
        grep -q "<version>${VERSION}</version>" /tmp/printlib.pom

        echo "Checking public JAR: ${JAR_URL}"
        for attempt in $(seq 1 12); do
          if curl --fail --silent --show-error --location --range 0-1023 "${JAR_URL}" -o /tmp/printlib.jar.part; then
            echo "Public JitPack jar is available on attempt ${attempt}."
            exit 0
          fi

          echo "JitPack artifact not ready yet (attempt ${attempt}/12); retrying in 15s..."
          sleep 15
        done

        echo "JitPack artifact did not become available for version ${VERSION}."
        exit 1
